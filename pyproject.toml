[project]
name = "indago-investigate"
version = "0.1.0"
description = "Evidence-constrained investigation CLIs (catalog, health audit, L0–L2 tools)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Dmitry Savkov" }]
dependencies = [
    "loguru>=0.7",
    "pandas>=2.2",
    "pyarrow>=14.0",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
score = ["joblib>=1.4", "scikit-learn>=1.5", "lightgbm>=4.0"]
dev = ["pytest>=8.0"]

[project.scripts]
indago-catalog = "indago_investigate.catalog:main"
indago-health-audit = "indago_investigate.health_audit.run:main"
indago-investigate = "indago_investigate.tools.cli:main"
indago-materialize = "indago_investigate.materialize_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["indago_investigate"]

[tool.hatch.build.targets.sdist]
include = [
    "indago_investigate",
    "agent-instructions",
    "agent",
    "docs",
    "examples",
    "README.md",
    "LICENSE",
    ".env.example",
]
